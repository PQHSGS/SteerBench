[project]
name = "LinEAS"
version = "0.0.1"
description = "A package to intervene internal responses of LLMs and Text-to-Image Diffusion."
readme = "README.rst"
authors = [
  { name = "Pau Rodríguez", email = "pau.rodriguez@apple.com" },
  { name = "Arno Blaas", email = "ablaas@apple.com" },
  { name = "Xavier Suau", email = "xsuaucuadros@apple.com" },
  # { name = "Valentino Maiorca", email = "v_maiorca@apple.com" },
]
license = { text = "Apple Sample Code License" }
requires-python = "== 3.11.*"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchmetrics==1.8.2",
  "tensorstore==0.1.77",
  "transformers==4.56.2",
  "diffusers==0.35.1",
  "blobfile==3.1.0",
  "datasets==4.1.1",
  "black==25.9.0",
  "pre-commit==4.3.0",
  "scikit-learn==1.7.2",
  "pandas==2.3.3",
  "wandb==0.22.1",
  "numpy==1.26.4",
  "pytest==8.4.2",
  "lm-eval==0.4.9",
  "hydra-core==1.3.2",
  "opencv-python==4.11.0.86",
  "natsort==8.4.0",
  "proxtorch==0.0.9",
  "peft==0.17.1",
  "GitPython==3.1.45",
  "python-dotenv==1.1.1",
  "matplotlib==3.10.6",
  "trl==0.11.4",
  "accelerate==1.10.1",
]

[project.urls]
homepage = "https://github.com/apple/ml-lineas"

[tool.ruff.lint]
select = [
  # # pycodestyle
  # "E",
  # # Pyflakes
  # "F",
  # # pyupgrade
  # "UP",
  # # flake8-bugbear
  # "B",
  # # flake8-simplify
  # "SIM",
  # isort
  "I",
]

# Below taken from https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[tool.setuptools.packages.find]
where = ["."] # list of folders that contain the packages (["."] by default)
include = [
  "datasets",
  "evaluations",
  "hooks",
  "models",
  "optimal_transport",
  "scripts",
  "utils",
  "lineas",
] # package names should match these glob patterns (["*"] by default)
exclude = [
  "tests*",
] # exclude packages matching these glob patterns (empty by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

[tool.pytest.ini_options]
pythonpath = [ # Adds code path to pytest
  ".",
]
addopts = "--capture=no" # Don't capture stdout/stderr (default: "auto")

[tool.isort]
profile = "black" # Sets isort to use Black-compatible formatting

[tool.uv.pip]
python-platform = "x86_64-apple-darwin"

[tool.uv.sources]
lineas = { workspace = true }
# trl (transformers reinforcement learning) is under big refactor. Higher versions do not work :(
trl = { git = "https://github.com/huggingface/trl", rev = "v0.11.4" }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu124" # 124 and not 126 because of https://github.com/astral-sh/uv/issues/11945 (torch issue)
explicit = true


[dependency-groups]
dev = [
  "lineas",
  "ipykernel>=6.29.5",
  "pytest",
  "ruff",
#  "cfassetlib",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"
