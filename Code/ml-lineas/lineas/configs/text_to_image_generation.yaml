hydra:
  job:
    chdir: false

defaults:
  - _self_
  ####################
  #   Wandb config   #
  ####################
  - wandb/lineas.yaml
  ####################
  #   Intervention   #
  ####################
  - intervention_params: lineas
  ####################
  #    Diffusion     #
  ####################
  # Tasks
  - task_params: coco_styles.yaml
  # Models
  - model: DMD2.yaml

intervention_params:
  use_inputs: false

task_params: null

# Data and Model Loading Settings
data_dir: ${oc.env:DATA_DIR,/tmp/lineas-data}
cache_dir: ${oc.env:CACHE_DIR,${data_dir}}
results_dir: ${oc.env:OUTPUT_DIR,/tmp/lineas-results}

# Some globals
device: 'cuda'
fast: false
seed: 42
# By default we let model config specify batch_size
batch_size: ${model.default_batch_size}

# evaluation: e.g. ['clip_score']
evaluation: ${task_params.default_evaluation}

model:
  module_names: ${.default_modules.default}

responses:
  # If false, responses won't be computed
  enabled: true
  # Response Generation Settings
  batch_size: ${batch_size}
  balanced_data: true
  save_fields: [] # Extra fields to save with responses
  shuffle: true
  device: "${device}"
  dtype: ${dtype:torch.float32}
  max_batches: null
  num_workers: 1
  seed: ${seed}
  resume: true
  data_dir: ${data_dir}
  cache_dir: ${cache_dir}
  tag: "responses"
  # Params for response-saving hooks
  intervention_params:
    name: "postprocess_and_save"
    pooling_op: ${interventions.intervention_params.pooling_op}
    hook_params:
      raise_exception: false
  # see configs/task_params
  task_params: ${task_params}
  model_params: ${model}

interventions:
  # If false, interventions won't be computed
  enabled: true
  # Response Generation Settings
  batch_size: 2
  max_batches: null
  shuffle: true
  device: "cpu"
  dtype: {dtype:torch.float32}
  load_fields: []
  num_workers: 1
  # Allow training with batch_size < 4 (not recommended, may cause issues)
  force_small_batch: false
  seed: ${seed}
  resume: false
  cache_dir: ${cache_dir}
  tag: "interventions"
  # see configs/task_params
  task_params: ${task_params}
  # see configs/intervention_params
  intervention_params: ${intervention_params}
  # see configs/model
  model_params: ${model}
  # Where logs and plots created during intervention estimation are saved
  results_dir: "${results_dir}"
  # Wandb params
  wandb: ${wandb}

text_to_image_generation:
  max_batches: 4
  num_workers: 2
  device: "${device}"
  seed: ${seed}
  data_dir: ${data_dir}
  cache_dir: ${cache_dir}
  # Text generation batch size.
  batch_size: ${batch_size}
  # Will sweep over these numbers
  diffusion_guidance_scale: []
  # Base number for guidance scale
  guidance_scale: ${.model_params.generation_kwargs.guidance_scale}
  # Base number of diffusion inference steps
  num_inference_steps: ${.model_params.generation_kwargs.inference_steps}
  # Diffusion image resolution
  generation_resolution: 224
  # Where results are saved
  results_dir: ${results_dir}
  # If true, also save a gif animation
  create_gif: true
  create_mp4: false
  # see configs/intervention_params
  intervention_params: ${intervention_params}
  # Strentgths for which to generate images
  min_strength: 0.0
  max_strength: 1.0
  # Will execute np.linspace over this number of steps
  strength_steps: 11
  # If true, run script in fast mode (small batches, small data, not useful for true results)
  fast: ${fast}
  verbose: 1
  # See defaults on top of this file
  task_params: ${task_params}
  # see configs/model
  model_params: ${model}
  # wandb params
  wandb: ${wandb}
  # Use these prompts to generate instead of reading from a dataset
  prompt_override: null

clip_score:
  input_folder: ${results_dir}/generate_with_hooks_diffusion
  results_dir: ${results_dir}
  device: ${device}
  # wandb params
  wandb: ${wandb}